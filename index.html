
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARMY RUNNER 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101b21;font-family:Arial,sans-serif;color:white}
canvas{display:block}
#hud{position:fixed;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none;z-index:2}
.panel{background:#102331dd;border:1px solid #8ca8b5;padding:12px 18px;border-radius:12px;font-weight:bold;box-shadow:0 5px 20px #0005}
#score{font-size:24px;color:#ffd34d}
#coins{font-size:17px;margin-top:5px;color:#ffe57a}
#menu{position:fixed;inset:0;z-index:5;background:linear-gradient(#06152366,#061523e8);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.card{max-width:430px;width:100%;padding:28px 22px;border:1px solid #7c9ca9;border-radius:22px;background:#0c202eeF;box-shadow:0 20px 70px #0008}
h1{font-size:clamp(34px,9vw,54px);margin:0;color:#d5e8c1;letter-spacing:2px}
.card p{color:#c5d4dc;line-height:1.6}
button{border:0;cursor:pointer;font-weight:bold;color:white;touch-action:manipulation}
.mainbtn{padding:15px 34px;border-radius:12px;background:#b7d45b;color:#14231b;font-size:18px;margin-top:12px}
#controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;z-index:3;pointer-events:none}
.group{display:flex;gap:10px;align-items:end}
.ctrl{pointer-events:auto;width:62px;height:62px;border-radius:18px;background:#112b3bd9;border:1px solid #b4cbd4;font-size:24px;box-shadow:0 4px 15px #0005}
#jump{width:86px;height:86px;border-radius:50%;background:#b5d75d;color:#14251b;font-size:17px;border:4px solid #e5f2bd}
#pause{position:fixed;top:15px;right:15px;z-index:4;background:#122938dd;border:1px solid #8ca8b5;border-radius:10px;padding:12px 15px;display:none}
#tip{position:fixed;top:110px;left:0;right:0;text-align:center;color:white;text-shadow:0 2px 5px black;font-size:12px;pointer-events:none}
</style>
</head>
<body>

<div id="hud">
  <div class="panel">
    <div>🪖 ARMY RUNNER</div>
    <div id="score">SCORE: 0</div>
    <div id="coins">★ COINS: 0</div>
  </div>
</div>

<div id="tip">← → CHANGE LANE &nbsp; | &nbsp; SPACE TO JUMP</div>
<button id="pause" onclick="pauseGame()">Ⅱ PAUSE</button>

<div id="controls">
  <div class="group">
    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="right">▶</button>
  </div>
  <button class="ctrl" id="jump">⬆<br>JUMP</button>
</div>

<div id="menu">
  <div class="card">
    <h1>ARMY RUNNER</h1>
    <p>3D MILITARY MISSION</p>
    <p>Run through the army base, collect gold coins and jump over obstacles. How far can you go?</p>
    <p>⌨️ Arrow keys to move<br>Space to jump<br>📱 Use the on-screen buttons</p>
    <button class="mainbtn" id="start">▶ START MISSION</button>
    <p style="font-size:12px">Endless running adventure</p>
  </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91c9e9);
scene.fog = new THREE.Fog(0x91c9e9, 30, 100);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth / innerHeight, 0.1, 180
);
camera.position.set(0, 5.2, 9.5);
camera.lookAt(0, 1, -5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd8efff, 0x596143, 2));

const sun = new THREE.DirectionalLight(0xfff1d1, 2.5);
sun.position.set(-5, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const mat = (color, roughness=0.9) =>
  new THREE.MeshStandardMaterial({color,roughness});

const green = mat(0x4c6037);
const darkGreen = mat(0x293b2b);
const skin = mat(0xc49b73);
const black = mat(0x202522);
const roadMat = mat(0x444a4b);
const sand = mat(0xc4b28b);
const gold = new THREE.MeshStandardMaterial({
  color:0xffc928, metalness:0.65, roughness:0.25,
  emissive:0x573300, emissiveIntensity:0.3
});

function block(w,h,d,material,x,y,z,parent=scene){
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),material
  );
  m.position.set(x,y,z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function ball(r,material,x,y,z,parent){
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(r,12,10),material
  );
  m.position.set(x,y,z);
  m.castShadow = true;
  parent.add(m);
  return m;
}

// Ground and endless road
const ground = block(200,0.5,200,mat(0x66794b),0,-0.55,-60);

block(9,0.15,200,roadMat,0,-0.25,-60);

const markings = [];
for(let z=-150;z<15;z+=6){
  markings.push(block(0.12,0.025,2.5,mat(0xe4e0c8),0,-0.16,z));
}

const scenery = [];
for(let z=-145;z<12;z+=9){
  for(const side of [-1,1]){
    const x=side*(7+Math.random()*5);
    const g=new THREE.Group();
    block(0.35,1.5,0.35,darkGreen,0,0.65,0,g);
    const crown=new THREE.Mesh(
      new THREE.ConeGeometry(1.1,2.5,7),
      mat(0x314e32)
    );
    crown.position.y=2.4;
    crown.castShadow=true;
    g.add(crown);
    g.position.set(x,-0.25,z);
    scene.add(g);
    scenery.push(g);
  }
}

// Distant mountains
for(let i=0;i<18;i++){
  const mountain=new THREE.Mesh(
    new THREE.ConeGeometry(5+Math.random()*5,9+Math.random()*9,5),
    mat(i%2?0x718a8c:0x829b9c)
  );
  mountain.position.set((i-9)*12,4,-95-Math.random()*12);
  scene.add(mountain);
}

// Army watchtowers
for(const x of [-10,10]){
  const z=-27;
  for(const dx of [-1,1]){
    block(0.18,4,0.18,darkGreen,x+dx,2,z);
  }
  block(3,0.18,2.4,darkGreen,x,4,z);
  block(2.8,1.2,2.2,green,x,4.7,z);
  block(3.3,0.15,2.7,sand,x,5.4,z);
}

// Build a simple 3D army soldier
const soldier=new THREE.Group();
scene.add(soldier);
soldier.position.set(0,0,2);

const torso=block(0.85,1.05,0.42,green,0,1.55,0,soldier);
block(0.9,0.4,0.45,darkGreen,0,1.65,-0.24,soldier);
block(0.85,0.15,0.45,sand,0,1.15,0,soldier);

const head=ball(0.29,skin,0,2.35,0,soldier);
const helmet=ball(0.34,green,0,2.57,0,soldier);
block(0.65,0.09,0.52,darkGreen,0,2.43,0,soldier);

const limbs=[];
function limb(w,h,d,material,x,y,z){
  const pivot=new THREE.Group();
  pivot.position.set(x,y,z);
  soldier.add(pivot);
  block(w,h,d,material,0,-h/2,0,pivot);
  limbs.push(pivot);
  return pivot;
}

const leftLeg=limb(0.29,0.8,0.34,green,-0.25,1.05,0);
const rightLeg=limb(0.29,0.8,0.34,green,0.25,1.05,0);
const leftArm=limb(0.24,0.75,0.25,green,-0.55,1.85,0);
const rightArm=limb(0.24,0.75,0.25,green,0.55,1.85,0);

block(0.12,0.3,0.13,black,-0.25,-0.18,0,leftLeg);
block(0.12,0.3,0.13,black,0.25,-0.18,0,rightLeg);

// Toy-style military backpack
block(0.5,0.7,0.3,darkGreen,0,1.7,0.34,soldier);

// Lanes
const lanes=[-2.7,0,2.7];
let lane=1;
let running=false,paused=false,over=false;
let score=0,coinCount=0,speed=17;
let jumpY=0,jumpV=0;
let spawnTimer=0,coinTimer=0;
let lastTime=0;
let objects=[];
let best=Number(localStorage.getItem('armyRunnerBest')||0);

function addObstacle(){
  const laneIndex=Math.floor(Math.random()*3);
  const z=-85;
  const g=new THREE.Group();
  const type=Math.random();

  if(type<0.5){
    block(1.5,1.25,1.2,green,0,0.62,0,g);
    block(1.58,0.13,1.28,sand,0,1.1,0,g);
    // wooden crate details
    block(0.08,1.1,1.3,darkGreen,-0.4,0.62,0,g);
    block(0.08,1.1,1.3,darkGreen,0.4,0.62,0,g);
  }else{
    block(1.8,0.7,1.1,sand,0,0.35,0,g);
    for(let i=0;i<3;i++){
      ball(0.36,sand,-0.55+i*0.55,0.6,0,g);
    }
  }

  g.position.set(lanes[laneIndex],0,z);
  scene.add(g);
  objects.push({group:g,lane:laneIndex,type:'obstacle',hit:false});
}

function addCoin(){
  const laneIndex=Math.floor(Math.random()*3);
  const g=new THREE.Group();
  const coin=new THREE.Mesh(
    new THREE.TorusGeometry(0.38,0.13,10,20),gold
  );
  coin.rotation.y=Math.PI/2;
  coin.castShadow=true;
  g.add(coin);
  const star= new THREE.Mesh(
    new THREE.OctahedronGeometry(0.22),gold
  );
  g.add(star);
  g.position.set(lanes[laneIndex],1.5,-85);
  scene.add(g);
  objects.push({group:g,lane:laneIndex,type:'coin',hit:false});
}

function updateHUD(){
  document.getElementById('score').textContent='SCORE: '+Math.floor(score);
  document.getElementById('coins').textContent='★ COINS: '+coinCount;
}

function startGame(){
  for(const o of objects)scene.remove(o.group);
  objects=[];
  score=0;coinCount=0;speed=17;
  lane=1;jumpY=0;jumpV=0;
  spawnTimer=0.5;coinTimer=1;
  soldier.position.set(0,0,2);
  running=true;paused=false;over=false;
  document.getElementById('menu').style.display='none';
  document.getElementById('pause').style.display='block';
  document.getElementById('pause').textContent='Ⅱ PAUSE';
  updateHUD();
}

function endGame(){
  running=false;over=true;
  best=Math.max(best,Math.floor(score));
  localStorage.setItem('armyRunnerBest',best);
  document.getElementById('pause').style.display='none';
  document.getElementById('menu').style.display='flex';
  document.querySelector('#menu h1').textContent='MISSION OVER';
  document.querySelector('#menu .card p').textContent=
    'SCORE: '+Math.floor(score)+' | COINS: '+coinCount+
    ' | BEST: '+best;
  document.querySelector('#menu .card p:nth-of-type(2)').textContent=
    'Keep running, soldier! Try again to beat your best score.';
  document.getElementById('start').textContent='↻ RESTART MISSION';
}

function pauseGame(){
  if(!running)return;
  paused=!paused;
  document.getElementById('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE';
}

function moveLane(dir){
  if(!running||paused)return;
  lane=Math.max(0,Math.min(2,lane+dir));
}

function jump(){
  if(!running||paused||jumpY>0.02)return;
  jumpV=9.5;
}

document.getElementById('start').addEventListener('click',startGame);
document.getElementById('left').addEventListener('click',()=>moveLane(-1));
document.getElementById('right').addEventListener('click',()=>moveLane(1));
document.getElementById('jump').addEventListener('click',jump);

addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();
  if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA')moveLane(-1);
  if(e.code==='ArrowRight'||e.code==='KeyD')moveLane(1);
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jump();
  if(e.code==='Escape')pauseGame();
});

let touchX=0;
renderer.domElement.addEventListener('touchstart',e=>{
  touchX=e.touches[0].clientX;
},{passive:true});
renderer.domElement.addEventListener('touchend',e=>{
  const diff=e.changedTouches[0].clientX-touchX;
  if(Math.abs(diff)>45)moveLane(diff>0?1:-1);
},{passive:true});

function animate(time){
  requestAnimationFrame(animate);
  const dt=Math.min((time-lastTime)/1000||0,0.04);
  lastTime=time;

  if(running&&!paused){
    score+=dt*10;
    speed=Math.min(29,17+score/250);
    spawnTimer-=dt;
    coinTimer-=dt;

    if(spawnTimer<=0){
      addObstacle();
      spawnTimer=Math.max(0.58,1.35-Math.random()*0.4-score/1800);
    }
    if(coinTimer<=0){
      addCoin();
      coinTimer=0.75+Math.random()*0.65;
    }

    // Move the world toward the runner
    for(const m of markings){
      m.position.z+=speed*dt;
      if(m.position.z>8)m.position.z-=165;
    }
    for(const s of scenery){
      s.position.z+=speed*dt;
      if(s.position.z>12)s.position.z-=162;
    }

    // Smooth lane movement
    soldier.position.x=THREE.MathUtils.damp(
      soldier.position.x,lanes[lane],10,dt
    );

    // Jump physics
    jumpV-=24*dt;
    jumpY+=jumpV*dt;
    if(jumpY<0){jumpY=0;jumpV=0}
    soldier.position.y=jumpY;

    // Running animation
    const t=time*0.012;
    if(jumpY<0.1){
      leftLeg.rotation.x=Math.sin(t)*0.7;
      rightLeg.rotation.x=-Math.sin(t)*0.7;
      leftArm.rotation.x=-Math.sin(t)*0.55;
      rightArm.rotation.x=Math.sin(t)*0.55;
    }else{
      leftLeg.rotation.x=-0.6;
      rightLeg.rotation.x=0.6;
      leftArm.rotation.x=-0.5;
      rightArm.rotation.x=-0.5;
    }
    soldier.rotation.z=THREE.MathUtils.damp(
      soldier.rotation.z,(lanes[lane]-soldier.position.x)*-0.08,8,dt
    );

    // Obstacles and coin collection
    for(let i=objects.length-1;i>=0;i--){
      const o=objects[i];
      o.group.position.z+=speed*dt;
      o.group.rotation.y+=o.type==='coin'?dt*2:0;

      const close=Math.abs(o.group.position.z-soldier.position.z)<1.05;
      const sameLane=Math.abs(o.group.position.x-soldier.position.x)<1.1;

      if(close&&sameLane&&!o.hit){
        o.hit=true;
        if(o.type==='coin'){
          coinCount++;
          score+=50;
          scene.remove(o.group);
          objects.splice(i,1);
          continue;
        }else if(jumpY<1.05){
          endGame();
          break;
        }
      }

      if(o.group.position.z>10){
        scene.remove(o.group);
        objects.splice(i,1);
      }
    }

    updateHUD();
  }

  // Gentle camera follow
  camera.position.x=THREE.MathUtils.damp(
    camera.position.x,soldier.position.x*0.22,2.5,dt
  );
  camera.lookAt(soldier.position.x*0.12,1.3,-5);

  renderer.render(scene,camera);
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
});

animate(0);
</script>
</body>
</html>
